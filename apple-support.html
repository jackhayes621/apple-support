<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple - Help Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Inter",sans-serif}
body{background:linear-gradient(180deg,#3f87bd,#67b5eb);min-height:100vh}

/* NAVBAR */
nav{
height:56px;
background:#255f8d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
gap:15px;
box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.left-nav,.right-nav{
display:flex;
align-items:center;
gap:10px;
}
.logo{
background:#1f4060;
color:#fff;
padding:7px 12px;
border-radius:6px;
display:flex;
align-items:center;
gap:6px;
font-size:14px;
font-weight:600;
white-space:nowrap;
}
.help-btn{
background:#fff;
padding:7px 12px;
border-radius:6px;
font-size:14px;
white-space:nowrap;
}
.center-logo{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}
.center-logo img{
height:28px;
width:auto;
display:block;
}
.circle{
width:34px;
height:34px;
border-radius:50%;
background:#336f9b;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:13px;
}
.search{
width:180px;
background:#3a6f96;
padding:7px 12px;
border-radius:6px;
display:flex;
align-items:center;
gap:8px;
color:#fff;
}
.search input{
width:100%;
background:transparent;
border:none;
outline:none;
color:#fff;
font-size:13px;
}
.search input::placeholder{color:#d8e6f1}
.start{
background:#fff;
padding:7px 16px;
border-radius:20px;
font-size:13px;
font-weight:600;
white-space:nowrap;
}

/* CONTENT */
.container{
width:min(1200px,95%);
margin:28px auto;
}
.support-card{
max-width:600px;
background:#fff;
border-radius:12px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}
.card-header{
padding:18px 20px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:24px;
font-weight:600;
}
.item{
display:flex;
gap:16px;
align-items:center;
padding:18px 20px;
border-top:1px solid #ececec;
}
.thumb{
width:90px;
height:70px;
background:#0d7ff2;
border-radius:6px;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:13px;
flex-shrink:0;
}
.title{font-size:20px;font-weight:500;margin-bottom:5px}
.sub{font-size:14px;color:#777;word-break:break-word}

/* Tablet */
@media(max-width:992px){
nav{
height:auto;
padding:12px 16px;
flex-wrap:wrap;
justify-content:center;
}
.left-nav,.right-nav{
width:100%;
justify-content:center;
flex-wrap:wrap;
}
.center-logo{
order:-1;
width:100%;
margin-bottom:8px;
}
.center-logo img{height:26px}
}

/* Mobile */
@media(max-width:768px){
.search{width:100%}
.support-card{max-width:100%}
.card-header{font-size:22px}
.title{font-size:18px}
.sub{font-size:13px}
}

/* Small Mobile */
@media(max-width:480px){
.logo,.help-btn,.start{
width:100%;
justify-content:center;
text-align:center;
}
.item{
flex-direction:column;
align-items:flex-start;
}
.thumb{
width:100%;
height:140px;
}
.center-logo img{height:22px}
}
nav,
.support-card{
    cursor:pointer;
}
</style>
</head>
<body>

<nav>
<div class="left-nav">
<div class="logo"><i class="fa-brands fa-apple"></i>Apple Help</div>
<div class="help-btn">Apple Helpdesk</div>
</div>

<div class="center-logo">
<img src="images/logoapp.webp" alt="Logo">
</div>

<div class="right-nav">
<div class="circle"><i class="fas fa-ellipsis-v"></i></div>
<div class="search">
<i class="fas fa-search"></i>
<input placeholder="Bookmarks">
</div>
<div class="start">Start for free</div>
<div class="circle"><i class="far fa-user"></i></div>
</div>
</nav>

<div class="container">
<div class="support-card">
<div class="card-header">
Apple Support
<i class="fas fa-ellipsis-h"></i>
</div>

<div class="item">
<div class="thumb">Apple</div>
<div>
<div class="title">Apple Number 1-(866) 876-7516</div>
<div class="sub">two4x7apple-experts.onrender.com</div>
</div>
</div>

<div class="item">
<div class="thumb" style="background:#ddd;color:#222;">Support</div>
<div>
<div class="title">Apple Support 1-(866) 876-7516</div>
<div class="sub">two4x7apple-experts.onrender.com</div>
</div>
</div>

</div>
</div>
<script>
document.querySelector("nav").addEventListener("click", function () {
    window.location.href = "apple-support-line.html";
});

document.querySelector(".support-card").addEventListener("click", function () {
    window.location.href = "apple-support-line.html";
});
</script>
</body>
</html>
